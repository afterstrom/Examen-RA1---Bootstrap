      </ul>

<header class="bg-secondary text-white text-center py-4">
  <div class="container">
    <h1>Reserva la teva Taula</h1>
  </div>
</header>

<main class="flex-grow-1 py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow border-0">
          <div class="card-body p-4">
            <div id="missatgeConfirmacio"></div>
            <form id="formulariReserva">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="nom" class="form-label">Nom <span class="text-secondary">*</span></label>
                  <input type="text" class="form-control" id="nom" placeholder="Ex. Joan" required>
                </div>
                <div class="col-md-6">
                  <label for="cognoms" class="form-label">Cognoms <span class="text-secondary">*</span></label>
                  <input type="text" class="form-control" id="cognoms" placeholder="Ex. Garcia Perez" required>
                </div>
                <div class="col-md-6">
                  <label for="telefon" class="form-label">Telèfon <span class="text-secondary">*</span></label>
                  <input type="tel" class="form-control" id="telefon" placeholder="600000000" required>
                </div>
                <div class="col-md-6">
                  <label for="correu" class="form-label">Correu electrònic <span class="text-secondary">*</span></label>
                  <input type="email" class="form-control" id="correu" placeholder="nom@exemple.cat" required>
                </div>
                <div class="col-12">
                  <label for="data" class="form-label">Data de la reserva <span class="text-secondary">*</span></label>
                  <input type="date" class="form-control" id="data" required>
                </div>
                <div class="col-12">
                  <label for="consulta" class="form-label">Detalls o Al·lèrgies (Consulta) <span class="text-secondary">*</span></label>
                  <textarea class="form-control" id="consulta" rows="3" placeholder="Indica nombre de comensals, al·lèrgies o preferències d'àrea..." required></textarea>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-dark w-100 fw-bold">Enviar Reserva</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="bg-dark text-white border-top border-secondary border-3 pt-4 pb-3">
  <div class="container">
    <div class="row">
      <div class="col-md-6 text-center text-md-start mb-3">
        <p class="fw-bold mb-1">Restaurant Sakura Badalona</p>
        <p class="small text-white-50 mb-0">Plaça de l'Alcalde Xifré, 26, Badalona</p>
        <p class="small text-white-50 mb-0">93 876 54 32</p>
      </div>
      <div class="col-md-6 text-center text-md-end">
        <p class="fw-bold mb-1">CFGM SMX - INS Barres i Ones</p>
        <p class="small text-white-50 mb-0">Desenvolupat per: <strong class="text-white">Ahmed Farhan</strong></p>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="java.js"></script>
</body>
</html>
